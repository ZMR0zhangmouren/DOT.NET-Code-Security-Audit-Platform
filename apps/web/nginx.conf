# =============================================================
#  nginx config for @platform/web (React SPA + reverse proxy to api)
#
#  设计要点:
#  - listen 80
#  - SPA 路由:任何非 /api /socket.io /assets 请求 → /index.html(让 react-router 处理)
#  - /api/*   → http://api:3030(容器名,compose 自动 DNS)
#  - /socket.io → http://api:3030(WebSocket upgrade)
#  - 静态资源长 cache;index.html 不 cache
# =============================================================
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 默认字符集 + Gzip
  charset utf-8;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml text/javascript
             application/javascript application/json application/xml+rss
             image/svg+xml;

  # 客户端最大上传体(zip 源码包)—— 同步 start.bat 默认 200MB
  client_max_body_size 200M;

  # ---------- /api 反向代理 ----------
  location /api/ {
    proxy_pass http://api:3030;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    # 上传(zip)长 timeout
    proxy_connect_timeout 60s;
  }

  # ---------- /socket.io 反向代理(WebSocket)----------
  location /socket.io/ {
    proxy_pass http://api:3030;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 86400s;       # ws 长连接 24h
    proxy_send_timeout 86400s;
  }

  # ---------- 静态资源(assets 子目录)----------
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # ---------- SPA fallback ----------
  # 任何找不到的 .html / .js 路径都让 react-router 接管
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html 强制不 cache(否则 vite 改 hash 后老用户会卡)
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    expires -1;
  }

  # 简易 health(给 docker compose healthcheck 用)
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
}
